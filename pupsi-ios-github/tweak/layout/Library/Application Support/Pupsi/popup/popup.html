<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>Pupsi v1</h1>
    <span class="version">made by static</span>
  </div>

  <label class="toggle-row">
    <span>Enabled</span>
    <input type="checkbox" id="enabled" checked>
  </label>

  <div class="control-group">
    <label for="displayMode">Mode</label>
    <select id="displayMode">
      <option value="arrows">Best-move arrow</option>
      <option value="piece">Piece hint</option>
    </select>
  </div>

  <div class="control-group">
    <label for="moveTime">Think time (ms)</label>
    <input type="range" id="moveTime" min="200" max="5000" step="100" value="1000">
    <span class="value-label" id="moveTimeValue">1000 ms</span>
  </div>

  <div class="control-group">
    <label for="bestMoveChance">Reveal best move (%)</label>
    <input type="range" id="bestMoveChance" min="50" max="100" step="5" value="90">
    <span class="value-label" id="bestMoveChanceValue">90%</span>
  </div>

  <div class="control-group">
    <label for="multiPv">Lines shown</label>
    <input type="range" id="multiPv" min="1" max="3" step="1" value="1">
    <span class="value-label" id="multiPvValue">1</span>
  </div>

  <div class="control-group">
    <label for="arrowColor">Primary color</label>
    <div class="color-row">
      <input type="color" id="arrowColor" value="#39ff88">
      <span class="value-label" id="arrowColorValue">#39ff88</span>
    </div>
  </div>

  <div class="control-group">
    <label for="secondaryArrowColor">Backup color</label>
    <div class="color-row">
      <input type="color" id="secondaryArrowColor" value="#ffd700">
      <span class="value-label" id="secondaryArrowColorValue">#ffd700</span>
    </div>
  </div>

  <div class="control-group">
    <label for="arrowWidth">Arrow width</label>
    <input type="range" id="arrowWidth" min="2" max="16" step="1" value="6">
    <span class="value-label" id="arrowWidthValue">6</span>
  </div>

  <div class="control-group">
    <label for="glowStrength">Glow</label>
    <input type="range" id="glowStrength" min="0" max="100" step="5" value="70">
    <span class="value-label" id="glowStrengthValue">70</span>
  </div>

  <div class="control-group">
    <label class="toggle-row">
      <span>Pulse animation</span>
      <input type="checkbox" id="pulse" checked>
    </label>
  </div>

  <div class="control-group">
    <label class="toggle-row">
      <span>Show evaluation</span>
      <input type="checkbox" id="showEval" checked>
    </label>
  </div>

  <div class="control-group">
    <label class="toggle-row">
      <span>Show depth</span>
      <input type="checkbox" id="showDepth" checked>
    </label>
  </div>

  <div class="control-group">
    <label class="toggle-row">
      <span>Opponent's move</span>
      <input type="checkbox" id="showOpponentMove" checked>
    </label>
  </div>

  <div class="control-group">
    <label for="overlayOpacity">Blend (opacity)</label>
    <input type="range" id="overlayOpacity" min="5" max="100" step="5" value="100">
    <span class="value-label" id="overlayOpacityValue">100%</span>
  </div>

  <div class="control-group">
    <label class="toggle-row">
      <span>Menu sounds</span>
      <input type="checkbox" id="menuSounds" checked>
    </label>
  </div>

  <div class="footer">
    <button id="resetBtn" class="btn-secondary">Reset defaults</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
